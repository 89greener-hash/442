<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<meta name="description" content="수비의 약점을 읽고 드래그로 패스 길을 찾는 축구 퍼즐">
<title>패스 퍼즐</title>
<style>
:root{--bg:#0e1512;--panel:#16211b;--line:#2a3a31;--tx:#f2f6f3;--sub:#9db0a4;--gold:#ffd95a;--acc:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:8px;min-height:40px}
.bar .grow{flex:1}
.pill{font-size:13px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.pill b{color:var(--tx)}
.dots{letter-spacing:2px;color:var(--gold);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06111f;font-weight:700}
#field{display:block;width:100%;border-radius:14px;background:#3d8b4a;touch-action:none;user-select:none;-webkit-user-select:none}
#msg{font-size:14px;line-height:1.45;min-height:40px;color:var(--tx);padding:0 2px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
#card .w{display:flex;gap:6px;align-items:flex-start}
#card .w b{color:var(--gold);white-space:nowrap}
#card .w span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card.open .w span{white-space:normal}
#card .more{display:none;margin-top:6px;color:#d9e6dd}
#card.open .more{display:block}
#card .geo{margin-top:6px;font-size:12px;color:var(--sub)}
#card .tip{font-size:12px;color:var(--sub);margin-top:4px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;font-size:12px;color:var(--sub)}
.tools .btn i{font-style:normal;font-size:22px;line-height:1.1;color:var(--tx)}
.tools .btn:disabled{opacity:.4}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.mask.show{display:flex}
.sheet{width:100%;max-width:520px;background:#121b16;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .g{margin:12px 0 6px;font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:40px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#06111f;font-weight:700}
.sheet .go{width:100%;margin-top:16px;font-size:16px}
.big{font-size:34px;letter-spacing:4px;color:var(--gold);text-align:center;margin:4px 0 8px}
.sheet p{margin:0 0 6px;line-height:1.5;font-size:14px}
.row2{display:flex;gap:8px;margin-top:14px}
.row2 .btn{flex:1}
#loading{position:fixed;inset:0;background:rgba(14,21,18,.9);display:none;align-items:center;justify-content:center;z-index:20;font-size:15px;text-align:center;padding:20px;line-height:1.6}
#loading.show{display:flex}
svg text{font-family:inherit}
.diff{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);padding:0 4px}
.diff b{color:var(--gold);letter-spacing:2px;font-size:15px}
.diff{gap:8px}#diffL{white-space:nowrap}#diffR{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{flex:none;width:40px;height:36px;font-size:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#stage{position:relative;width:100%}

.tcard{position:absolute;left:8px;right:8px;z-index:40;display:flex;align-items:flex-end;gap:2px;pointer-events:none}

.tcard .bub{pointer-events:auto;position:relative;flex:1;min-width:0;background:#fff;color:#14201a;border-radius:16px;padding:11px 12px 10px;margin-bottom:14px;box-shadow:0 6px 22px rgba(0,0,0,.55);animation:bpop .25s ease-out}
.tcard .bub:before{content:"";position:absolute;left:-9px;top:34px;border:9px solid transparent;border-left:0;border-right-color:#fff}
@keyframes bpop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.tcard .tapi{position:absolute;right:12px;bottom:7px;font-size:12px;color:#6b8577;opacity:0}.tcard .bub.done .tapi{opacity:1;animation:tblink 1s ease-in-out infinite}@keyframes tblink{50%{opacity:.25}}
.tuthl{pointer-events:none}
.tcard p{margin:0 0 14px;font-size:14.5px;line-height:1.5;color:#14201a;white-space:pre-line;font-weight:600}
.tcard .tb2{display:flex;gap:6px;align-items:center}
.tcard button{height:36px;border-radius:11px;border:0;font-size:13.5px}
.tcard button.p{flex:1;background:#2f7cf6;color:#fff;font-weight:700}
.tcard button:not(.p){background:transparent;color:#6b8577;padding:0 8px}
#tut{display:none}#tut.on{display:block}
#tutDim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);pointer-events:auto}
.tuthl{z-index:31!important;outline:3px solid #ffd95a;outline-offset:2px;border-radius:10px;animation:tglow 1.1s ease-in-out infinite}
@keyframes tglow{50%{outline-color:rgba(255,217,90,.25)}}
#tutHand{position:absolute;z-index:35;font-size:34px;pointer-events:none;display:none;margin:-8px 0 0 -12px;filter:drop-shadow(0 2px 4px #000)}
#tutHand.on{display:block;animation:thand 2.2s ease-in-out infinite}
@keyframes thand{0%{transform:translate(var(--x1),var(--y1));opacity:0}12%{transform:translate(var(--x1),var(--y1));opacity:1}70%{transform:translate(var(--x2),var(--y2));opacity:1}100%{transform:translate(var(--x2),var(--y2));opacity:0}}

.ui{position:absolute;box-sizing:border-box;z-index:2}#field{z-index:1}#diffR{pointer-events:none}.pill .dots{letter-spacing:-.5px;font-size:.95em}.pill b{letter-spacing:-1px}.pill{padding:0 3px;height:30px;display:flex;align-items:center;justify-content:center;overflow:hidden}#toast{position:absolute;left:8%;width:84%;z-index:9;background:rgba(10,16,12,.32);color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;box-sizing:border-box}#toast.on{opacity:1}#goalDim{position:absolute;z-index:8;background:rgba(0,0,0,.62);border-radius:14px;opacity:0;pointer-events:none}#goalDim.on{animation:gdim 1.6s ease-out}@keyframes gdim{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}#goalFx{position:absolute;left:0;width:100%;text-align:center;z-index:9;font-size:52px;font-weight:900;color:#ffe45c;letter-spacing:2px;text-shadow:0 0 4px #000,0 0 4px #000,0 3px 10px rgba(0,0,0,.6);pointer-events:none;opacity:0;transform:scale(.4)}#goalFx.on{animation:gfx 1.5s ease-out}@keyframes gfx{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}}#card.open{z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.45)}#bGrid{display:flex;align-items:center;justify-content:center;padding:0;min-height:0;aspect-ratio:1/1;height:auto;line-height:1;font-weight:700;background:rgba(150,150,150,.22);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px}#bGrid svg{display:block}#bGrid::after{content:'';position:absolute;inset:-9px}
#bNew,.pill,.tb{white-space:nowrap}
#field{aspect-ratio:72/76;height:auto}
.pill.ui{text-align:center}
.dots{font-size:1.08em}
.diff b{font-size:1.15em}
#diffL{white-space:nowrap;color:var(--sub)}
#diffR{line-height:1.25;text-align:right;overflow:visible;white-space:nowrap;color:#07140b;font-weight:700;text-shadow:0 0 3px rgba(255,255,255,.35)}
#card .geo,#card .tip{font-size:.86em}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--sub);line-height:1.2}
.tb i{font-style:normal;font-size:1.8em;line-height:1.1;color:var(--tx)}
.tb:disabled{opacity:.4}

#map{display:none;padding:2px 0 24px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 10px}
.mt{font-size:22px;font-weight:800;letter-spacing:-.3px}.ms{font-size:12.5px;color:var(--sub);margin-top:2px}
.mstar{font-size:15px;color:var(--gold);font-weight:700;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#mFree{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px;text-align:left}
#mFree small{font-weight:400;color:var(--sub);font-size:12px;display:block;margin-top:2px}
.rgw{margin-bottom:14px;border-radius:16px;overflow:hidden;background:#3c4046}.rg{display:block;width:100%;height:auto;touch-action:manipulation}.rgh{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:#0f1a14;border-bottom:1px solid var(--line)}.rgh b{display:block;font-size:17px}.rgh span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}.rgh .rr{text-align:right}.rgh .rr b{color:var(--gold);font-size:14px}.rgh.lkd{opacity:.6}
.nd{cursor:pointer}.nd.lk{cursor:default}
@keyframes pu{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 1.5s ease-out infinite}
#mapTip{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,16,13,.92);border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}

.chip.lk{opacity:.5;border-style:dashed}

.sheet .go2{width:100%;margin-top:8px}

#mStage{position:relative;width:100%}

.mu{position:absolute;box-sizing:border-box}
.mt{font-size:1.55em;font-weight:800;letter-spacing:-.3px}.ms{font-size:.9em;color:var(--sub);margin-top:2px}
.mpill{text-align:right;color:var(--gold);font-weight:700;white-space:nowrap}
#mFree{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;white-space:nowrap;padding:10px 6px;z-index:2;background:rgba(5,12,8,.5);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#mFree small{font-weight:400;color:var(--sub);font-size:.8em;display:block;margin-top:2px}
#rName b{display:block;font-size:1em}#rName span,#rDiff span{display:block;font-size:.9em;color:var(--sub);margin-top:2px}
#rDiff{text-align:right}#rDiff b{display:block;color:var(--gold);font-size:1em}
#mView{overflow:hidden;border-radius:14px;aspect-ratio:360/640;touch-action:none;background:#3a3e44;user-select:none;-webkit-user-select:none}
#mRegs{position:absolute;left:0;top:0;width:100%;height:500%;will-change:transform}
.pg{height:20%;width:100%}.pg svg{display:block;width:100%;height:100%}
#rDots{display:flex;justify-content:center;align-items:center}
.dt{position:relative;width:12px;height:12px;border-radius:50%;background:#3b4a41;border:2px solid #5d7064;margin:0 8px;padding:0}
.dt::after{content:"";position:absolute;inset:-12px}
.dt.ok{background:var(--gold);border-color:var(--gold)}.dt.on{background:#fff;border-color:#fff;transform:scale(1.3)}
#mTitle,#mStar,#rName,#rDiff,#mCap{z-index:2}#mTitle,#mStar,#rName b,#rDiff b{white-space:nowrap}#mView{z-index:1}
#rName,#rDiff{background:rgba(5,12,8,.5);border-radius:10px;padding:3px 6px;white-space:nowrap}#rName span{font-size:.78em!important}#rName em{font-style:normal;color:var(--gold);font-size:.78em;margin-left:4px;font-weight:700}#rName,#rDiff,#mCap{pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7)}
#rName span,#rDiff span{color:#e8f0ea}#rDiff b{color:var(--gold)}#mCap{text-align:center;font-size:.9em}
.hnt{position:absolute;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font-size:11.5px;color:#fff;background:rgba(5,12,8,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;white-space:nowrap}
#lockMsg{top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:700;padding:6px 14px;background:rgba(5,12,8,.72)}#hintT{top:2.2%}#hintB{bottom:2.2%}.hnt i{font-style:normal;display:inline-block;animation:bn 1.3s ease-in-out infinite}#hintB i{animation-name:bu}
@keyframes bn{50%{transform:translateY(3px)}}@keyframes bu{50%{transform:translateY(-3px)}}
#mView::before,#mView::after{content:"";position:absolute;left:0;right:0;z-index:3;pointer-events:none}
#mView::before{top:0;height:22%;background:linear-gradient(rgba(5,12,8,.6),rgba(5,12,8,0))}#mView::after{bottom:0;height:14%;background:linear-gradient(rgba(5,12,8,0),rgba(5,12,8,.6))}
</style>
